# Keeps the profile's live parts fresh:
#  - the contribution snake, in the bat-signal palette, pushed to the `output` branch,
#    which the README links to directly;
#  - the whoami card, rebuilt with the current contribution count and date.
name: Refresh profile

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["assets/**", "README.md"]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#b4232f&color_dots=#eeeeea,#f6e3a1,#e8c65a,#c89b12,#8a6a00
            dist/snake-dark.svg?color_snake=#e5484d&color_dots=#161b22,#3d3413,#6b5a14,#b08d12,#f5c518

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild the cards
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile cards"
            git push
          fi
